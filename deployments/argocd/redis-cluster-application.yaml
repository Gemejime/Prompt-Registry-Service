apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-prompt-registry-service-redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: redis-cluster
      targetRevision: "11.*"
      helm:
        releaseName: rag-prompt-registry-service-redis
        valueFiles:
          - $values/deployments/helm/redis-cluster/values.yaml
    - repoURL: https://github.com/rag-platform/rag-prompt-registry-service.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rag-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

