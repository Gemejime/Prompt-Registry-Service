apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-prompt-registry.fullname" . }}-config
  labels:
    {{- include "rag-prompt-registry.labels" . | nindent 4 }}
data:
  {{- $env := .Values.env | default dict }}
  HTTP_PORT: {{ default "8080" (get $env "HTTP_PORT") | quote }}
  GRPC_PORT: {{ default "9090" (get $env "GRPC_PORT") | quote }}
  {{- range $key, $val := $env }}
  {{- if and (ne $key "secretName") (ne $key "HTTP_PORT") (ne $key "GRPC_PORT") (ne $val nil) }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
