{{- $envSecret := "" -}}
{{- if .Values.env -}}
{{- $envSecret = get .Values.env "secretName" | default "" -}}
{{- end -}}
{{- if and (not .Values.secrets.existingSecret) (not $envSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-prompt-registry.secretName" . }}
  labels:
    {{- include "rag-prompt-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.secrets.postgresDSN | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_HMAC_SECRET: {{ .Values.secrets.jwtHmacSecret | quote }}
{{- end }}

