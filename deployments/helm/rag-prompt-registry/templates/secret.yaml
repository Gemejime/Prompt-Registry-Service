{{- $envSecret := "" -}}
{{- if .Values.env -}}
{{- $envSecret = get .Values.env "secretName" | default "" -}}
{{- end -}}
{{- $externalSecret := .Values.secrets.existingSecret | default $envSecret -}}
{{- if $externalSecret -}}
{{- $existingObj := lookup "v1" "Secret" .Release.Namespace $externalSecret -}}
{{- if $existingObj -}}
{{- $ann := $existingObj.metadata.annotations | default dict -}}
{{- if and (eq (get $ann "meta.helm.sh/release-name") .Release.Name) (ne (get $ann "helm.sh/resource-policy") "keep") -}}
{{- fail (printf "Secret %q is still managed by Helm release %q without helm.sh/resource-policy=keep; complete an explicit handoff upgrade (keep chart-managed Secret once so Helm records helm.sh/resource-policy=keep, or annotate/remove Helm ownership) before switching to existingSecret" $externalSecret .Release.Name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $externalSecret }}
{{- $jwtSecret := trim (default "" .Values.secrets.jwtHmacSecret) -}}
{{- if not $jwtSecret -}}
{{- fail "secrets.jwtHmacSecret must not be empty when creating a chart-managed Secret (or set secrets.existingSecret / env.secretName)" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-prompt-registry.secretName" . }}
  labels:
    {{- include "rag-prompt-registry.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.secrets.postgresDSN | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_HMAC_SECRET: {{ .Values.secrets.jwtHmacSecret | quote }}
{{- end }}

