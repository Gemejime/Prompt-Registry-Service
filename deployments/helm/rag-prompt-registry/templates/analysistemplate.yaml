{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "rag-prompt-registry.fullname" . }}-canary-analysis
  labels:
    {{- include "rag-prompt-registry.labels" . | nindent 4 }}
spec:
  args:
    - name: namespace
    - name: release
    - name: canary-hash
  metrics:
    - name: invalidation-publish-error-rate
      interval: 30s
      count: 4
      successCondition: result[0] == 0
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.canary.prometheusAddress | quote }}
          query: |
            (
              sum(rate(prompt_invalidation_events_published_total{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",status="error"}[2m]))
              OR on() vector(0)
            )
            and on() (
              sum((up{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"} == 1) and count_over_time(up{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m]) > 0) > 0
            )
    - name: mutation-error-rate
      interval: 30s
      count: 4
      successCondition: result[0] == 0
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.canary.prometheusAddress | quote }}
          query: |
            (
              sum(rate(prompt_registry_mutation_duration_seconds_count{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",status="error"}[2m]))
              OR on() vector(0)
            )
            and on() (
              sum((up{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"} == 1) and count_over_time(up{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m]) > 0) > 0
            )
    - name: elevated-pointer-rollbacks
      interval: 30s
      count: 4
      successCondition: result[0] == 0
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.canary.prometheusAddress | quote }}
          query: |
            (
              sum(increase(prompt_registry_pointer_rollbacks_total{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[15m]))
              OR on() vector(0)
            )
            and on() (
              sum((up{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"} == 1) and count_over_time(up{namespace="{{`{{args.namespace}}`}}",app_kubernetes_io_instance="{{`{{args.release}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m]) > 0) > 0
            )
{{- end }}

