name: CI/CD Pipeline - RAG Prompt Registry Service

on:
  push:
    branches: [main, master, develop, rag-prompt-registry-service]
  pull_request:
    branches: [main, master, develop, rag-prompt-registry-service]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Verify Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet Analysis
        run: |
          if [ -f go.mod ]; then
            go vet ./...
          else
            echo "go.mod not yet created; skipping go vet"
          fi

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true

  security-and-logging-audit:
    name: Security & Logging Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Govulncheck
        run: |
          if [ -f go.mod ]; then
            govulncheck ./...
          else
            echo "go.mod not yet created; skipping govulncheck"
          fi

      - name: Run Gosec Security AST Scanner
        uses: securego/gosec@v2.21.4
        with:
          args: '-no-fail -fmt=sarif -out=gosec.sarif ./...'
        continue-on-error: true

      - name: Secured Logging Invariant Audit (Verify No Sensitive Data Leaks in Logs)
        run: |
          echo "Auditing codebase for secured logging invariants..."
          # Detect forbidden logging patterns: raw prompt templates, raw context payloads, authorization tokens, passwords
          ILLEGAL_LOGS=$(grep -rnE '(log|slog|zap|logrus)\.(Print|Info|Debug|Warn|Error).*(raw_prompt|raw_context|password|secret|bearer|authorization)' . \
            --exclude-dir={.git,.github,vendor,tasks,test} || true)
          if [ -n "$ILLEGAL_LOGS" ]; then
            echo "CRITICAL: Potential unredacted sensitive payload logging detected:"
            echo "$ILLEGAL_LOGS"
            exit 1
          fi
          echo "Secured logging audit passed: no raw text spans or secret leaks found."

  openapi-doc-api-contract-sync:
    name: OpenAPI 3.1 & Doc API Contract Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate OpenAPI 3.1 Specification
        run: pipx run openapi-spec-validator==0.7.1 openapi/openapi.yaml
        continue-on-error: true

      - name: Verify Doc API Contract Synchronization
        run: |
          echo "Verifying continuous synchronization between OpenAPI specs and .ai/doc-api.md..."
          if [ -f openapi/openapi.yaml ] && [ ! -f .ai/doc-api.md ]; then
            echo "Error: openapi/openapi.yaml exists but .ai/doc-api.md is missing!"
            exit 1
          fi
          if [ -f .ai/doc-api.md ]; then
            echo "Doc API file present. Validating mandatory sections..."
            grep -qi "Continuous Doc API Update Invariant" .ai/doc-api.md || (echo "Missing continuous sync invariant in .ai/doc-api.md" && exit 1)
            grep -q "rag-prompt-registry-service" .ai/doc-api.md || (echo "Doc API does not target rag-prompt-registry-service" && exit 1)
          fi
          echo "OpenAPI 3.1 and Doc API synchronization check completed successfully."

  test-suites:
    name: Test Suites & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Unit Tests
        run: |
          if [ -f go.mod ]; then
            go test -v -race -covermode=atomic -coverprofile=coverage.out ./test/unit/...
          else
            echo "go.mod not yet created; skipping unit tests"
          fi

      - name: Run SDK Benchmarks (Allocation & P99 Latency Checks)
        run: |
          if [ -f go.mod ]; then
            go test -v -bench=. -benchmem ./pkg/promptsdk/...
          else
            echo "go.mod not yet created; skipping benchmarks"
          fi

      - name: Run Integration Tests
        run: |
          if [ -f go.mod ]; then
            go test -v ./test/integration/...
          else
            echo "go.mod not yet created; skipping integration tests"
          fi

